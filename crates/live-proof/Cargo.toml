[package]
name = "live-proof"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Signed proof steps of a live system run: proof/run.jsonl, one signed Step per line, verifiable offline"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
