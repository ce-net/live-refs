[package]
name = "sim-mesh"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "N child-process nodes on loopback, each with its own ed25519 key and door: signed typed calls, kill, rejoin, partition, heal"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
