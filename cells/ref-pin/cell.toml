# One cell, one function. Contract: contracts/ref_pin.rs (compiled by ce_wire::api! in refs-wire).
[cell]
api = "ref.pin"
owner = "live-refs"
kind = "function"
crate = "live-ref-pin"
args = ["serve"]
depends_on = []

[launch]
health = "HealthOp"
start_timeout_ms = 5000
restart_backoff_ms = [1000, 300000]

[limits]
disk_bytes = "64M"  # the most its folders may hold
