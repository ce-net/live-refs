[workspace]
resolver = "2"
members = [".", "crates/ce-ref-id", "crates/wire-lite", "crates/refs-api", "crates/live-proof", "crates/sim-mesh"]
exclude = ["cells"]

[package]
name = "live-refs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "A live system: ce-refs connecting anything to anything across a mesh of devices"
default-run = "live-refs"

[dependencies]
ce-ref-id = { path = "crates/ce-ref-id" }
refs-api = { path = "crates/refs-api" }
wire-lite = { path = "crates/wire-lite" }
live-proof = { path = "crates/live-proof" }
sim-mesh = { path = "crates/sim-mesh" }
ce-net-proto = { git = "https://github.com/ce-net/ce-net-proto", rev = "ff449250618cc70bde491055cb97e8ef42121390" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2

[dev-dependencies]
ed25519-dalek = "2"
